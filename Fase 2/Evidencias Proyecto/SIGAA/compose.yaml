name: sigaa

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigaa}
      POSTGRES_USER: ${POSTGRES_USER:-sigaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure una clave privada en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - sigaa_internal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      MIGRATION_FILES: /app/migrations/007_sprint3_security.sql,/app/migrations/008_school_operations.sql
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigaa}:${POSTGRES_PASSWORD:?Configure una clave privada en .env}@db:5432/${POSTGRES_DB:-sigaa}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./infra/postgres/init:/app/migrations:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - sigaa_internal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - sigaa_internal

volumes:
  postgres_data:

networks:
  sigaa_internal:
    driver: bridge
