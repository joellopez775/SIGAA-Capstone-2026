# Cloudflare terminates HTTPS before the private tunnel. Scope this policy to
# the published SIGAA host so local Docker HTTP and other domains stay unchanged.
map "$host|$http_x_forwarded_proto" $sigaa_https_redirect {
    default 0;
    "sigaa.ignisert.com|http" 1;
}
map "$host|$http_x_forwarded_proto" $sigaa_hsts {
    default "";
    "sigaa.ignisert.com|https" "max-age=31536000";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($sigaa_https_redirect) {
        return 308 https://sigaa.ignisert.com$request_uri;
    }
    add_header Strict-Transport-Security $sigaa_hsts always;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Resolve the service again when Docker replaces its container/IP.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_origin http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
