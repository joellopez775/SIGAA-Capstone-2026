name: sigaa-sprint3-tests
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sigaa_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Configure una clave efimera para las pruebas}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigaa_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [tests]
  api-tests:
    build:
      context: ./apps/api
      target: test
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://sigaa_test:${TEST_DB_PASSWORD:?Configure una clave efimera para las pruebas}@db:5432/postgres
    volumes:
      - ./infra/postgres/init:/infra/postgres/init:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [tests]
networks:
  tests:
    internal: true
